# build/batsujo.yml — 罰条の対応表(正)
#
# なぜあるか
# ----------
# arukikata/index.html には「違反は○年以下の拘禁刑またはX万円以下の罰金＝○条○項○号」
# という罰則の記載が40箇所前後ある。同じ禁止行為・同じ罰条が複数箇所に書かれているため、
# レビューで1箇所だけ直して別の箇所が古いまま残る事故が起きる(過去に201条の15・住居侵入罪で実例あり)。
# このファイルを正として、build/precheck.py の G17 がページ内の記載と突き合わせる。
#
# 構造
# ----
# rules[].id             : 禁止行為の識別子(スネークケース)
# rules[].desc           : 人間向けの説明
# rules[].base_article   : 禁止行為の根拠条(禁止そのものを定める条文)
# rules[].penalty_article: 罰条(違反したときに適用される条文)。1つの行為に複数の号が
#                          関係する場合はリストで複数持つ(例: 243条1項4号と5号の2)。
# rules[].penalty_text   : 刑量の文字列(ページの表記に合わせる)
# rules[].occurrences[]  : ページ内でこの罰条に言及している箇所。行番号は動くので持たない。
#   .anchor   : 近傍の固有な文字列(タグを除去した本文に対して検索する)。罰条の数字そのものは
#               書き換えられうるので、anchor にはできるだけ数字を含めない(例外あり)。
#   .before/.after: anchor の前後何文字を「同じ言及のまとまり」として見るか(既定150)。
#               本文側で刑量が条文番号より先に出てくる場合は before を大きくする。
#   .term     : その occurrence で期待する刑量文字列。省略時は rules[].penalty_text を使う。
#   .penalty_article: その occurrence で期待する罰条。省略時は rules[].penalty_article を使う。
#               空リスト[]を指定すると、その箇所は罰条の数字までは書かれていない(「罰則あり」
#               等の要約表現)とみなし、刑量(term)の一致だけを見る。
#   .all      : true の場合、anchor に一致する箇所をすべて検査する(同一文面が複数タブに
#               重複して存在するケース)。false(既定)のときは anchor が複数回出現したら
#               「想定外の重複」としてエラーにする(本文の構造が変わった合図)。
#
# 運用
# ----
#   - 本文に新しい禁止行為・罰則の記載を追加/修正したら、ここも追記/修正すること。
#   - build/precheck.py --only G17 -v で、この対応表と本文の整合を単体確認できる。

