<head>

<title>ポスターマップ — 掲示板の貼付け管理</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#1f2937; --muted:#6b7280; --bg:#f6f7fb; --card:#fff; --accent:#8b5cf6;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif; color:var(--ink); background:var(--bg); display:flex; flex-direction:column;}
header.appbar{background:var(--accent); color:#fff; padding:8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; z-index:1100;}

header.appbar a:hover{text-decoration:underline;}
.toolbar{display:flex; gap:6px; flex-wrap:wrap;}
.toolbar button, .toolbar label.filebtn{font-family:inherit; font-size:12px; font-weight:bold; border:none; border-radius:8px; padding:6px 10px; cursor:pointer; background:rgba(255,255,255,.18); color:#fff;}
.toolbar button:hover, .toolbar label.filebtn:hover{background:rgba(255,255,255,.32);}
.toolbar a.dlbtn{font-size:12px; font-weight:bold; border-radius:8px; padding:6px 10px; background:rgba(255,255,255,.18); color:#fff !important; text-decoration:none;}
.toolbar a.dlbtn:hover{background:rgba(255,255,255,.32); text-decoration:none;}
.toolbar input[type=file]{display:none;}
#map{flex:1; min-height:0;}
.samplebar{background:#fffbeb; border-bottom:1.5px solid #f59e0b; color:#92400e; font-size:12px; padding:5px 12px; text-align:center;}
.leaflet-popup-content{font-size:13px; line-height:1.7;}
.leaflet-popup-content select, .leaflet-popup-content input[type=text], .leaflet-popup-content textarea{font-family:inherit; font-size:12.5px; width:100%; border:1px solid #d1d5db; border-radius:6px; padding:4px 6px; margin:2px 0 6px;}
.leaflet-popup-content button{font-family:inherit; font-size:12px; font-weight:bold; border:none; border-radius:6px; padding:5px 12px; cursor:pointer; margin-right:6px;}
.popupSave{background:var(--accent); color:#fff;}
.popupDel{background:#fee2e2; color:#b91c1c;}
.statbox{background:rgba(255,255,255,.94); border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,.25); padding:8px 12px; font-size:12px; line-height:1.6;}
.statbox b{font-size:17px;}
.legend{background:rgba(255,255,255,.94); border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,.25); padding:8px 12px; font-size:12px; line-height:1.9;}
.legend i{display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid #333; margin-right:6px; vertical-align:-1px;}
.legend i.sq{border-radius:3px;}
/* 世帯数レイヤの町丁目ラベル(地域名で改行して世帯数)。ポスター・ポスティング共通。
   枠なし透過のまま、濃紺の太字+強い白フチでベース地図から浮き立たせる */
.setaiLabel{ background:transparent; border:none; box-shadow:none; color:#08306b; font-weight:900; font-size:var(--setaiFs, 12px);
  text-shadow:-.08em -.08em 0 #fff, .08em -.08em 0 #fff, -.08em .08em 0 #fff, .08em .08em 0 #fff, -.12em 0 0 #fff, .12em 0 0 #fff, 0 -.12em 0 #fff, 0 .12em 0 #fff, 0 0 .33em #fff, 0 0 .58em #fff;
  pointer-events:none; text-align:center; line-height:1.25; }
.setaiLabel .setaiNm{ font-size:calc(var(--setaiFs, 12px) * .8); font-weight:800; color:#1e293b; }
.setaiLabel .setaiUnit{ font-size:calc(var(--setaiFs, 12px) * .75); font-weight:800; }
/* 自治体追加リクエストのモーダル(世帯数レイヤの凡例から開く)。ポスター・ポスティング共通 */
.reqOverlay{ position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; }
.reqBox{ background:#fff; border-radius:14px; max-width:520px; width:100%; max-height:90vh; overflow-y:auto; padding:18px 20px; font-size:13.5px; line-height:1.7; position:relative; }
.reqBox h3{ margin:0 0 8px; font-size:16px; }
.reqBox ol{ padding-left:20px; margin:6px 0; }
.reqClose{ position:absolute; top:10px; right:10px; width:28px; height:28px; border:1px solid #d1d5db; background:#fff; border-radius:8px; cursor:pointer; }
.reqCaution{ color:#b45309; font-size:12.5px; }
.reqBtns{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.reqBtn{ display:block; text-align:center; padding:9px 12px; border-radius:9px; border:1.5px solid #d1d5db; background:#f9fafb; color:#111; text-decoration:none; cursor:pointer; font-size:13.5px; }
.reqBtn.main{ background:#8b5cf6; border-color:#8b5cf6; color:#fff; font-weight:700; }
.locateBtn{background:#fff; border:2px solid rgba(0,0,0,.25); border-radius:6px; width:34px; height:34px; font-size:17px; cursor:pointer;}
.guideBtn{background:#fff; border:2px solid rgba(0,0,0,.25); border-radius:6px; width:34px; height:34px; font-size:17px; cursor:pointer; font-weight:bold; color:var(--accent);}
.guideBtn.on{background:var(--accent); color:#fff;}
.guidePanel{position:absolute; top:64px; right:12px; z-index:1200; width:min(480px, calc(100% - 24px)); max-height:calc(100% - 76px); overflow-y:auto; background:rgba(255,255,255,.97); border:1.5px solid var(--accent); border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.25); padding:14px 16px 12px; font-size:13px; line-height:1.7;}
.guidePanel h2{font-size:14.5px; color:var(--accent); margin-bottom:8px; padding-right:28px;}
.guidePanel ol{padding-left:20px; margin-bottom:8px;}
.guidePanel ol li{margin-bottom:4px;}
.guidePanel .gNote{font-size:11.5px; color:var(--muted); border-top:1px solid #e5e7eb; padding-top:6px;}
.guidePanel .gTabs{display:flex; gap:6px; margin:6px 0 10px; flex-wrap:wrap;}
.guidePanel .gTab{flex:1 1 auto; font-family:inherit; font-size:12px; font-weight:bold; cursor:pointer; border:1.5px solid #e5e7eb; background:#fff; color:var(--ink); border-radius:99px; padding:5px 10px; white-space:nowrap;}
.guidePanel .gTab:hover{border-color:var(--accent);}

.guidePanel .gPane ol{padding-left:20px; margin-bottom:8px;}
.guidePanel .gPane ol li{margin-bottom:4px;}

.guidePanel .gVideo{display:block; width:100%; height:auto; border:1px solid #e5e7eb; border-radius:8px; margin:4px 0 8px; cursor:zoom-in;}
.guidePanel .gVideoWrap{position:relative; margin:4px 0 8px;}
.guidePanel .gVideoWrap .gVideo{margin:0;}
.gVideoHint{position:absolute; top:8px; right:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:bold; padding:4px 11px; border-radius:99px; box-shadow:0 2px 6px rgba(0,0,0,.35); pointer-events:none; white-space:nowrap;}
.gVideoHint::after{content:""; position:absolute; bottom:-5px; right:16px; border:6px solid transparent; border-top:6px solid var(--accent); border-bottom:0;}
.guidePanel .gVideoCap{font-size:11px; color:var(--muted); margin:-4px 0 8px;}
.gLightbox{position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; padding:16px; cursor:zoom-out;}
.gLightbox img, .gLightbox video{width:96%; height:auto; max-height:94vh; object-fit:contain; border-radius:10px; box-shadow:0 8px 40px rgba(0,0,0,.6); background:#fff;}
.gLightbox .gLbClose{position:absolute; top:14px; right:20px; border:none; background:none; color:#fff; font-size:30px; cursor:pointer; line-height:1;}
.guideClose{position:absolute; top:8px; right:10px; border:none; background:none; font-size:18px; cursor:pointer; color:var(--muted); line-height:1;}
.guideClose:hover{color:var(--ink);}
@media (max-height:500px){ .guidePanel{max-height:calc(100% - 24px); overflow-y:auto;} }

/* 免責バー */
.noticebar{ display:flex; align-items:flex-start; gap:10px; background:#fef2f2; border-bottom:1.5px solid #ef4444; color:#7f1d1d; font-size:12px; line-height:1.6; padding:6px 12px; }
.noticebar .noticeClose{ flex:none; margin-left:auto; align-self:center; width:24px; height:24px; border:1px solid #fca5a5; background:#fff; color:#b91c1c; border-radius:6px; cursor:pointer; font-size:12px; line-height:1; }
.noticebar .noticeClose:hover{ background:#fee2e2; }

/* 地名検索コントロール */
.placeSearch{ background:#fff; border-radius:8px; box-shadow:0 1px 5px rgba(0,0,0,.4); padding:2px; }

/* ===== デバイス別最適化: 画面幅に応じてヘッダ・ツールバーを段階的にコンパクト化し地図面積を確保 =====
   〜700px=スマホ / 701〜1024px=タブレット / 1025px〜=PC(既定スタイル) */
@media (max-width: 1024px){ /* タブレット以下 */

}

<body>
<header class="appbar">
  <h1>🗺️ ポスターマップ</h1>
  <div class="toolbar">
    <label class="filebtn">📂 CSV読込<input type="file" id="csvIn"></label>
    <button id="csvOut">💾 CSV書出</button>
    <button id="resetBtn">状態リセット</button>
    <a class="dlbtn" href="https://yukinobu-nakamura.github.io/senkyo-maps/dist/poster_map_standalone.html" download="ポスターマップ.html" title="このアプリを1つのHTMLファイルとして保存(メール・LINE等で人に渡せます)">⬇️ アプリを保存</a>
    <a href="https://yukinobu-nakamura.github.io/senkyo-maps/" style="align-self:center;">← トップ</a>
  </div>
</header>
<div class="samplebar" style="background:#eef2ff; border-bottom-color:#6366f1; color:#3730a3;">📄 これは配布用ファイル版です。このHTMLファイルを渡せば誰でも使えます(動作にはインターネット接続が必要)。原本・最新版: <a href="https://yukinobu-nakamura.github.io/senkyo-maps/">https://yukinobu-nakamura.github.io/senkyo-maps/</a></div>
<div class="samplebar" id="sampleBar">⚠️ 表示中はサンプル(ダミー)データです。実際の掲示場一覧は選挙管理委員会の公表資料からCSVで読み込んでください。</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* 共通ユーティリティ(ポスターマップ/ポスティングマップ) */
"use strict";

/* ---- ベース地図 ---- */
function createBaseLayers() {
  const gsiPale = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
  });
  const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  });
  const gsiPhoto = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
  });
  return { "地理院地図(淡色)": gsiPale, "OpenStreetMap": osm, "航空写真(地理院)": gsiPhoto };
}

/* ---- 現在地ボタン ---- */
function addLocateControl(map) {
  const ctl = L.control({ position: "topleft" });
  ctl.onAdd = () => {
    const btn = L.DomUtil.create("button", "locateBtn");
    btn.textContent = "📍";
    btn.title = "現在地を表示";
    L.DomEvent.disableClickPropagation(btn);
    btn.onclick = () => map.locate({ setView: true, maxZoom: 16 });
    return btn;
  };
  ctl.addTo(map);
  let locMarker = null;
  map.on("locationfound", (e) => {
    if (locMarker) map.removeLayer(locMarker);
    locMarker = L.circleMarker(e.latlng, { radius: 7, color: "#fff", weight: 2, fillColor: "#1a73e8", fillOpacity: 1 }).addTo(map);
  });
  map.on("locationerror", () => alert("現在地を取得できませんでした​‌‌​​​‌​‌‌​‌(位置情報の許可を確認してください)"));
}

/* ---- 使い方ガイド(毎回初期表示、❓ボタンで開閉) ---- */
function addGuideControl(map, titleHtml, bodyHtml, storageKey) {
  const container = map.getContainer();

  const panel = document.createElement("div");
  panel.className = "guidePanel";
  panel.style.display = "none";
  panel.innerHTML = `<button class="guideClose" title="ガイドを閉じる" aria-label="ガイドを閉じる">✕</button><h2>${titleHtml}</h2>${bodyHtml}`;
  container.appendChild(panel);
  L.DomEvent.disableClickPropagation(panel);
  L.DomEvent.disableScrollPropagation(panel);

  let btn;
  function setOpen(open) {
    panel.style.display = open ? "block" : "none";
    if (btn) btn.classList.toggle("on", open);
  }
  panel.querySelector(".guideClose").onclick = () => setOpen(false);

  /* デモ動画: 吹き出し(PC=クリック/スマホ=タップ)+クリックで全画面表示 */
  const isTouch = window.matchMedia("(hover: none), (pointer: coarse)").matches;
  panel.querySelectorAll(".gVideo").forEach((media) => {
    const wrap = document.createElement("div");
    wrap.className = "gVideoWrap";
    media.parentNode.insertBefore(wrap, media);
    wrap.appendChild(media);
    const hint = document.createElement("span");
    hint.className = "gVideoHint";
    hint.textContent = isTouch ? "👆 タップで拡大" : "🖱️ クリックで拡大";
    wrap.appendChild(hint);
    if (media.tagName === "VIDEO") {
      // 自動再生がブラウザ都合で止まった場合に再開する保険
      const ensurePlay = () => { if (!document.hidden && media.paused) media.play().catch(() => {}); };
      media.addEventListener("loadeddata", ensurePlay);
      media.addEventListener("pause", ensurePlay);
      document.addEventListener("visibilitychange", ensurePlay);
      ensurePlay();
    }
    media.addEventListener("click", () => {
      const lb = document.createElement("div");
      lb.className = "gLightbox";
      let big;
      if (media.tagName === "VIDEO") {
        big = document.createElement("video");
        big.src = media.currentSrc || media.src;
        big.autoplay = true;
        big.muted = true;
        big.loop = true;
        big.playsInline = true;
      } else {
        big = document.createElement("img");
        big.src = media.src;
        big.alt = media.alt || "操作デモ(拡大)";
      }
      const close = document.createElement("button");
      close.className = "gLbClose";
      close.title = "閉じる";
      close.setAttribute("aria-label", "閉じる");
      close.textContent = "✕";
      lb.append(big, close);
      lb.addEventListener("click", () => lb.remove());
      document.body.appendChild(lb);
    });
  });

  const ctl = L.control({ position: "topleft" });
  ctl.onAdd = () => {
    btn = L.DomUtil.create("button", "guideBtn");
    btn.textContent = "❓";
    btn.title = "使い方ガイドを表示/非表示";
    L.DomEvent.disableClickPropagation(btn);
    btn.onclick = () => setOpen(panel.style.display === "none");
    return btn;
  };
  ctl.addTo(map);

  /* ガイド内のタブ切替(.gTab で .gPane を切り替え。動画は表示中のペインだけ再生) */
  const gTabs = panel.querySelectorAll(".gTab");
  const gPanes = panel.querySelectorAll(".gPane");
  if (gTabs.length && gPanes.length) {
    const showPane = (id) => {
      gPanes.forEach((p) => {
        const on = p.id === id;
        p.style.display = on ? "block" : "none";
        p.querySelectorAll("video").forEach((v) => { if (on) v.play().catch(() => {}); else v.pause(); });
      });
      gTabs.forEach((t) => t.classList.toggle("active", t.dataset.pane === id));
    };
    gTabs.forEach((t) => {
      L.DomEvent.disableClickPropagation(t);
      t.addEventListener("click", () => showPane(t.dataset.pane));
    });
    showPane(gTabs[0].dataset.pane);
  }

  setOpen(true);
}

/* ---- localStorage ---- */
function loadLocal(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveLocal(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

/* ---- ファイル入出力 ---- */
function downloadFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function onFileSelected(inputEl, handler) {
  inputEl.addEventListener("change", () => {
    const f = inputEl.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      handler(reader.result, f.name);
      inputEl.value = ""; // 同じファイルの再選択を許可
    };
    reader.readAsText(f, "utf-8");
  });
}

/* ---- CSV (RFC4180の範囲で簡易対応) ---- */
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  const src = text.replace(/^﻿/, "");
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (inQ) {
      if (c === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; } else { inQ = false; }
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && src[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.some((v) => v !== "")) rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.some((v) => v !== "")) rows.push(row);
  return rows;
}
function toCsv(rows) {
  const esc = (v) => {
    const s = String(v == null ? "" : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return rows.map((r) => r.map(esc).join(",")).join("\r\n");
}
function todayStamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
}

/* ---- CSV取り込みの共通処理 ----
   ヘッダー行の列名(別名可)から列位置を解決し、各データ行を {キー:値} の
   オブジェクト配列にして返す。poster/posting/gaisen で共用。
   spec  : { key: [別名, ...], ... }
   opts.require     : ["lat","long"] 等。無い列があれば {error} を返す
   opts.requireMsg  : require 不足時の alert 文言
   opts.nameFallback: true かつ spec に name があり列が無いとき、
                      既知列・数値列を除く最初のテキスト列を name に採用
   戻り値: { head, ix, records } または { error } */
function findCol(header, keys) {
  return header.findIndex((h) => keys.includes((h || "").trim()));
}
function importCsv(text, spec, opts) {
  opts = opts || {};
  const rows = parseCsv(text);
  if (rows.length < 2) return { error: "CSVにデータ行がありません" };
  const head = rows[0], ix = {};
  for (const k in spec) ix[k] = findCol(head, spec[k]);
  for (const k of (opts.require || [])) {
    if (ix[k] < 0) return { error: opts.requireMsg || ("必要な列が見つかりません: " + k) };
  }
  if (opts.nameFallback && ("name" in spec) && ix.name < 0) {
    const known = Object.keys(ix).filter((k) => k !== "name").map((k) => ix[k]);
    const sample = rows[1] || [];
    for (let i = 0; i < head.length; i++) {
      if (known.indexOf(i) >= 0) continue;
      const v = (sample[i] || "").trim();
      if (v && !isFinite(Number(v.replace(/,/g, "")))) { ix.name = i; break; }
    }
  }
  const records = rows.slice(1).map((r, i) => {
    const o = { _row: i };
    for (const k in spec) o[k] = ix[k] >= 0 ? (r[ix[k]] != null ? r[ix[k]] : "") : "";
    return o;
  });
  return { head, ix, records };
}

/* ---- GPX → GeoJSON ----
   トラック(<trk>/<trkseg>/<trkpt>)とルート(<rte>/<rtept>)を LineString に変換。
   1ファイルに複数の trk/rte を含む「結合GPX」もそれぞれ別ルートとして取り込む。
   名前空間つきGPXでも動くよう getElementsByTagName(局所名一致)で走査する。 */
function gpxToGeoJSON(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("XMLとして解析できませんでした");
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== "gpx") throw new Error("GPXファイルではありません");
  const features = [];
  const coordsFrom = (parent, tag) =>
    Array.from(parent.getElementsByTagName(tag))
      .map((p) => [parseFloat(p.getAttribute("lon")), parseFloat(p.getAttribute("lat"))])
      .filter((c) => isFinite(c[0]) && isFinite(c[1]));
  const directName = (el, fallback) => {
    for (const ch of Array.from(el.children)) {
      if (ch.nodeName.toLowerCase() === "name" && ch.textContent.trim()) return ch.textContent.trim();
    }
    return fallback;
  };
  const push = (coords, name) => {
    if (coords.length < 2) return;
    features.push({
      type: "Feature",
      geometry: { type: "LineString", coordinates: coords },
      properties: { name: name, memo: name },
    });
  };
  const trks = doc.getElementsByTagName("trk");
  for (let ti = 0; ti < trks.length; ti++) {
    const tname = directName(trks[ti], `トラック${ti + 1}`);
    const segs = trks[ti].getElementsByTagName("trkseg");
    for (let si = 0; si < segs.length; si++) {
      push(coordsFrom(segs[si], "trkpt"), segs.length > 1 ? `${tname} (${si + 1})` : tname);
    }
  }
  const rtes = doc.getElementsByTagName("rte");
  for (let ri = 0; ri < rtes.length; ri++) {
    push(coordsFrom(rtes[ri], "rtept"), directName(rtes[ri], `ルート${ri + 1}`));
  }
  return { type: "FeatureCollection", features };
}

/* ---- 国土地理院API(無料・キー不要): 地名の逆引き・住所検索 ----
   試験公開APIのため将来仕様変更の可能性あり。失敗時は静かに諦める設計にすること。 */
function gsiPlaceName(lat, lng) {
  return fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(j => {
      const nm = j && j.results && j.results.lv01Nm;
      return (nm && nm !== "－") ? nm : "";
    });
}

/* 地名検索コントロール(🔍で開閉)。全国の地名・住所から地図ジャンプ。 */
function addPlaceSearchControl(map) {
  const ctl = L.control({ position: "topleft" });
  let hitMarker = null;
  ctl.onAdd = () => {
    const div = L.DomUtil.create("div", "placeSearch");
    div.innerHTML =
      '<button class="psBtn" type="button" title="地名検索(全国)">🔍</button>' +
      '<span class="psBody" style="display:none">' +
      '<input class="psIn" type="text" placeholder="地名・住所(例: 池袋二丁目)">' +
      '<button class="psGo" type="button">検索</button><div class="psList"></div></span>';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    const btn = div.querySelector(".psBtn"), body = div.querySelector(".psBody");
    const input = div.querySelector(".psIn"), list = div.querySelector(".psList");
    btn.onclick = () => {
      const open = body.style.display === "none";
      body.style.display = open ? "inline-flex" : "none";
      if (open) input.focus();
    };
    async function run() {
      const q = input.value.trim();
      if (!q) return;
      list.textContent = "検索中…";
      try {
        const r = await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q));
        const arr = await r.json();
        if (!Array.isArray(arr) || !arr.length) { list.textContent = "見つかりませんでした"; return; }
        list.innerHTML = "";
        arr.slice(0, 8).forEach(a => {
          const co = a.geometry && a.geometry.coordinates;
          if (!co) return;
          const item = document.createElement("div");
          item.className = "psItem";
          item.textContent = (a.properties && a.properties.title) || q;
          item.onclick = () => {
            if (hitMarker) map.removeLayer(hitMarker);
            hitMarker = L.circleMarker([co[1], co[0]], { radius: 10, color: "#dc2626", weight: 3, fillOpacity: 0 }).addTo(map);
            map.setView([co[1], co[0]], Math.max(map.getZoom(), 15));
            list.innerHTML = "";
          };
          list.appendChild(item);
        });
      } catch (err) {
        list.textContent = "検索に失敗しました(接続を確認してください)";
      }
    }
    div.querySelector(".psGo").onclick = run;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
    return div;
  };
  ctl.addTo(map);
}
/* ===== 🏠 世帯数レイヤ(国勢調査2020 小地域・町丁目) =====
   ポスターマップ・ポスティングマップ共通。右上のレイヤボタンからON/OFFし、
   データは data/setai_<市区町村コード>.geojson を初回ONのときだけ取得する。
   収録自治体を増やすときは SETAI_SOURCES に1行足し、対応する geojson を
   build/make_setai_geojson.py で作って data/ に置く(コード・名称はe-Statの境界データが正)。 */
const SETAI_BINS = [
  { min: 5000, color: "#08519c", label: "5,000世帯〜" },
  { min: 4000, color: "#3182bd", label: "4,000〜" },
  { min: 3000, color: "#6baed6", label: "3,000〜" },

  { min: 1000, color: "#c6dbef", label: "1,000〜" },
  { min: 0,    color: "#eff3ff", label: "〜999世帯" },
];
function setaiColor(n){ for (const b of SETAI_BINS){ if (n >= b.min) return b.color; } return SETAI_BINS[SETAI_BINS.length - 1].color; }
const SETAI_CREDIT = "出典: 政府統計の総合窓口(e-Stat) 国勢調査(2020年)小地域境界データを加工して作成";
const SETAI_SOURCES = [
  { code: "13116", label: "🏠 世帯数: 豊島区" },
  { code: "13115", label: "🏠 世帯数: 杉並区" },
  { code: "13111", label: "🏠 世帯数: 大田区" },
  { code: "27126", label: "🏠 世帯数: 大阪市平野区" },
  /* 横浜市(18区) */
  { code: "14101", label: "🏠 世帯数: 横浜市鶴見区" },
  { code: "14102", label: "🏠 世帯数: 横浜市神奈川区" },
  { code: "14103", label: "🏠 世帯数: 横浜市西区" },

/* ズームに連動してラベル文字サイズを増減。
   引くほど小さく=ラベルが各町丁目の区画内に収まるように、寄るほど大きく読みやすく */
const SETAI_FONT_BY_ZOOM = { 13: 7, 14: 9, 15: 11.5, 16: 14, 17: 17, 18: 20 }; /* z12以下=5.5 / z18以上=20 */

/* map に世帯数レイヤ一式を追加する。
   opts.isExtraActive: 凡例を出すべき追加レイヤ(取込CSV等)がONかを返す関数(任意)
   戻り値.refreshLegend: 追加レイヤ側から凡例を出し直したいときに呼ぶ */
function addSetaiLayers(map, layersCtl, opts) {
  opts = opts || {};
  /* 手描き図形より下のペインに描くため、描画・クリック操作の邪魔をしない */
  map.createPane("setaiPane");
  map.getPane("setaiPane").style.zIndex = 350; /* overlayPane(400)より下 */
  const setaiRenderer = L.svg({ pane: "setaiPane", padding: 1 }); /* クリップ防止(map本体と同じ理由) */
  const setaiLayers = {};
  SETAI_SOURCES.forEach(s => {
    const grp = L.layerGroup();
    setaiLayers[s.label] = { grp, code: s.code, loaded: false };
    layersCtl.addOverlay(grp, s.label);
  });

  function setaiFill(ent, gj){
    L.geoJSON(gj, {
      pane: "setaiPane",
      renderer: setaiRenderer,
      style: f => ({ color: "#64748b", weight: 1, opacity: 0.55, fillColor: setaiColor(f.properties.setai), fillOpacity: 0.45 }),
      onEachFeature: (f, ly) => {
        const p = f.properties;
        ly.bindTooltip(`<span class="setaiNm">${p.name}</span><br>${p.setai.toLocaleString()}<span class="setaiUnit">世帯</span>`, { permanent: true, direction: "center", className: "setaiLabel" });
        ly.bindPopup(`<b>${p.name}</b><br>世帯数: <b>${p.setai.toLocaleString()}世帯</b><br>人口: ${p.jinko.toLocaleString()}人<br><span style="font-size:10.5px;color:#888">${SETAI_CREDIT}</span>`);
      },
    }).eachLayer(l => ent.grp.addLayer(l));
  }

  let setaiLegendCtl = null;
  function refreshLegend(){
    const active = Object.values(setaiLayers).some(ent => map.hasLayer(ent.grp)) ||
      !!(opts.isExtraActive && opts.isExtraActive());
    if (active && !setaiLegendCtl){
      setaiLegendCtl = L.control({ position: "bottomright" });
      setaiLegendCtl.onAdd = () => {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = `<div style="font-weight:700;margin-bottom:2px">🏠 世帯数(2020国勢調査)</div>` +
          SETAI_BINS.map(b => `<i class="sq" style="background:${b.color}"></i>${b.label}`).join("<br>") +
          `<div style="font-size:9.5px;color:#888;margin-top:3px;max-width:150px">${SETAI_CREDIT}</div>` +
          `<div style="margin-top:3px"><a href="#" id="setaiReqLink" style="font-size:10.5px">➕ 自治体の追加をリクエスト</a></div>`;
        return div;
      };
      setaiLegendCtl.addTo(map);
      const rl = document.getElementById("setaiReqLink");
      if (rl) rl.onclick = (ev) => { ev.preventDefault(); openReqModal(); };
    } else if (!active && setaiLegendCtl){
      map.removeControl(setaiLegendCtl);
      setaiLegendCtl = null;
    }
  }

  function setaiFontRefresh(){
    const z = Math.min(map.getZoom(), 18);
    map.getContainer().style.setProperty("--setaiFs", (SETAI_FONT_BY_ZOOM[z] || 5.5) + "px");
  }
  map.on("zoomend", setaiFontRefresh);
  setaiFontRefresh();

  map.on("overlayadd", (e) => {
    const ent = setaiLayers[e.name];
    refreshLegend();
    if (!ent || ent.loaded) return;
    ent.loaded = true;
    fetch("https://yukinobu-nakamura.github.io/senkyo-maps/data/setai_" + ent.code + ".geojson")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(gj => setaiFill(ent, gj))
      .catch(err => {
        ent.loaded = false;
        alert("世帯数データを読み込めませんでした(インターネット接続を確認してください): " + err.message);
      });
  });
  map.on("overlayremove", () => refreshLegend());

  return { refreshLegend, layers: setaiLayers };
}

<script>
"use strict";
/* ステータス定義(ここを書き換えれば増減可能) */
const STATUSES = [
  { id: 0, label: "未",     color: "#1e88e5" },
  { id: 1, label: "完了",   color: "#8b5cf6" },
  { id: 2, label: "予約",   color: "#fdd835" },
  { id: 3, label: "要確認", color: "#fb8c00" },
  { id: 4, label: "異常",   color: "#e53935" },
];
const KEY_BOARDS = "posterMap.boards";   // CSV読込後のデータ一式
const KEY_EDITS  = "posterMap.edits";    // サンプルデータへの編集差分 {id:{status,note}}

const map = L.map("map", { preferCanvas: true }).setView([35.7295, 139.7109], 14);
const baseLayers = createBaseLayers();
baseLayers["地理院地図(淡色)"].addTo(map);
const statusLayers = {};
STATUSES.forEach(s => { statusLayers[s.label] = L.layerGroup().addTo(map); });
const layersCtl = L.control.layers(baseLayers, statusLayers, { collapsed: true }).addTo(map);
addLocateControl(map);
addPlaceSearchControl(map);
L.control.scale({ imperial: false }).addTo(map);
/* 🏠 世帯数レイヤ(国勢調査2020・町丁目)。実装と収録自治体は assets/common.js の
   addSetaiLayers() / SETAI_SOURCES にあり、ポスティングマップと共通。
   掲示場ピンより下のペインに描くので、ピンのタップ操作の邪魔はしない。 */
addSetaiLayers(map, layersCtl);
addGuideControl(map, "🗺️ ポスターマップの使い方",
  `<ol>
    <li><b>掲示場データを読み込む</b> — 右上「📂 CSV読込」で選管公表の掲示場一覧CSVを読込(緯度・経度列が必要。今の表示はダミーのサンプル)</li>
    <li><b>ピンをタップ</b> — ステータス(未/完了/予約/要確認/異常)とメモを保存。色が変わり右上の完了率も更新されます</li>
    <li><b>表示を絞る</b> — 右上のレイヤボタンでステータス別に表示切替、左の📍で現在地表示</li>
    <li><b>🏠 世帯数を重ねる</b> — 右上のレイヤボタンから<b>世帯数レイヤ</b>(国勢調査2020・町丁目ごとの世帯数)を重ねられます(未収録の自治体は凡例の「➕ 自治体の追加をリクエスト」から)</li>
    <li><b>共有・バックアップ</b> — 「💾 CSV書出」で保存し、メンバーはそのCSVを「読込」すると同じ状態を再現できます</li>
  </ol>
  <video class="gVideo" src="https://yukinobu-nakamura.github.io/senkyo-maps/assets/poster_demo.mp4?v=2" autoplay muted loop playsinline width="2560" height="1262" aria-label="操作デモ: ピンをタップしてステータスとメモを保存すると色と完了率が更新される"></video>
  <div class="gVideoCap">▲ 操作デモ(ズーム→ピンをタップ→ステータス・メモを保存)</div>
  <div class="gNote">左上の<b>🔍で全国の地名検索</b>(例「池袋二丁目」)→地図がジャンプします。データはこの端末(ブラウザ)内にのみ保存されます。左上の❓でこのガイドを閉じたり再表示したりできます。</div>`,
  "posterMap");

/* 進捗ボックス */
const statCtl = L.control({ position: "topright" });
let statDiv;
statCtl.onAdd = () => { statDiv = L.DomUtil.create("div", "statbox"); return statDiv; };
statCtl.addTo(map);

/* 凡例 */
const legendCtl = L.control({ position: "bottomright" });
legendCtl.onAdd = () => {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = STATUSES.map(s => `<i style="background:${s.color}"></i>${s.label}`).join("<br>");
  return div;
};
legendCtl.addTo(map);

let boards = [];
let usingSample = true;

function statusOf(id) { return STATUSES.find(s => s.id === Number(id)) || STATUSES[0]; }

function renderStats() {
  const total = boards.length;
  const done = boards.filter(b => b.status === 1).length;
  const pct = total ? ((done / total) * 100).toFixed(1) : "0.0";
  statDiv.innerHTML = `完了率 <b>${pct}%</b><br>${done} / ${total} ヶ所(残り ${total - done})`;
}

function escT(v) { return (v == null ? "" : String(v)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function popupHtml(b) {
  const opts = STATUSES.map(s => `<option value="${s.id}" ${s.id === b.status ? "selected" : ""}>${s.label}</option>`).join("");
  return `<b>${escT(b.name)}</b><br>${escT(b.address)}<br>` +
    `<a href="https://www.google.com/maps/search/${Number(b.lat)},+${Number(b.long)}" target="_blank" rel="noopener noreferrer">Googleマップで開く</a><br>` +
    `ステータス:<select id="pStatus">${opts}</select>` +
    `メモ:<input type="text" id="pNote" value="${escT(b.note)}" maxlength="100">` +
    `<button class="popupSave" id="pSave">保存</button>`;
}

function renderBoards() {
  Object.values(statusLayers).forEach(l => l.clearLayers());
  boards.forEach(b => {
    const st = statusOf(b.status);
    const m = L.circleMarker([b.lat, b.long], {
      radius: 9, color: "#333", weight: 1, fillColor: st.color, fillOpacity: 0.92,
    }).addTo(statusLayers[st.label]);
    m.bindPopup(() => popupHtml(b));
    m.on("popupopen", (e) => {
      const node = e.popup.getElement();
      node.querySelector("#pSave").onclick = () => {
        b.status = Number(node.querySelector("#pStatus").value);
        b.note = node.querySelector("#pNote").value.trim();
        persist();
        map.closePopup();
        renderBoards();
      };
    });
  });
  renderStats();
}

function persist() {
  if (usingSample) {
    const edits = {};
    boards.forEach(b => { if (b.status !== 0 || b.note) edits[b.id] = { status: b.status, note: b.note }; });
    saveLocal(KEY_EDITS, edits);
  } else {
    saveLocal(KEY_BOARDS, boards);
  }
}

/* CSV読込: 列名で判定(name/名称, address/住所, lat/緯度, long|lng/経度, status, note/メモ) */
const COL = {
  id: ["id", "ID", "番号"], name: ["name", "名称", "掲示場名", "設置場所"],
  address: ["address", "住所", "所在地"], lat: ["lat", "latitude", "緯度"],
  long: ["long", "lng", "longitude", "経度"], status: ["status", "ステータス", "状態"],
  note: ["note", "メモ", "備考"],
};
onFileSelected(document.getElementById("csvIn"), (text) => {
  const res = importCsv(text, COL, { require: ["lat", "long"],
    requireMsg: "緯度(lat)・経度(long)の列が見つかりません。ヘッダー行を確認してください。" });
  if (res.error) return alert(res.error);
  const hasStatus = res.ix.status >= 0;
  const loaded = [];
  res.records.forEach((o, i) => {
    const lat = parseFloat(o.lat), long = parseFloat(o.long);
    if (!isFinite(lat) || !isFinite(long)) return;
    loaded.push({
      id: o.id ? o.id : `R${i + 1}`,
      name: o.name ? o.name : `地点${i + 1}`,
      address: o.address || "",
      lat, long,
      status: hasStatus ? (Number(o.status) || 0) : 0,
      note: o.note || "",
    });
  });
  if (!loaded.length) return alert("有効な座標の行がありません");
  boards = loaded;
  usingSample = false;
  persist();
  document.getElementById("sampleBar").style.display = "none";
  map.fitBounds(L.latLngBounds(boards.map(b => [b.lat, b.long])), { padding: [30, 30] });
  renderBoards();
});

document.getElementById("csvOut").onclick = () => {
  const rows = [["id", "name", "address", "lat", "long", "status", "statusLabel", "note"]];
  boards.forEach(b => rows.push([b.id, b.name, b.address, b.lat, b.long, b.status, statusOf(b.status).label, b.note]));
  downloadFile(`poster_boards_${todayStamp()}.csv`, "﻿" + toCsv(rows), "text/csv;charset=utf-8");
};

document.getElementById("resetBtn").onclick = () => {
  if (!confirm("保存済みのステータス・メモ・読込データをすべて消去してサンプルに戻します。よろしいですか?\n(必要ならまず「CSV書出」でバックアップしてください)")) return;
  localStorage.removeItem(KEY_BOARDS);
  localStorage.removeItem(KEY_EDITS);
  location.reload();
};

/* 起動: 保存済みデータ > サンプル+編集差分 */
(async function init() {
  const saved = loadLocal(KEY_BOARDS, null);
  if (saved && Array.isArray(saved) && saved.length) {
    boards = saved;
    usingSample = false;
    document.getElementById("sampleBar").style.display = "none";
    map.fitBounds(L.latLngBounds(boards.map(b => [b.lat, b.long])), { padding: [30, 30] });
  } else {
    if (Array.isArray(window.EMBEDDED_BOARDS)) {
      boards = window.EMBEDDED_BOARDS; // 配布用単一ファイル版はデータ同梱
    } else {
      const res = await fetch("https://yukinobu-nakamura.github.io/senkyo-maps/data/boards.sample.json");
      boards = await res.json();
    }
    const edits = loadLocal(KEY_EDITS, {});
    boards.forEach(b => { if (edits[b.id]) Object.assign(b, edits[b.id]); });
  }
  renderBoards();
})();
</script>
